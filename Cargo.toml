[package]
name = "kangarootwelve_xkcp"
version = "0.2.1"
edition = "2024"
authors = ["Jack O'Connor <oconnor663@gmail.com>"]
description = "An FFI wrapper for the XKCP implementation of the KangarooTwelve hash function"
repository = "https://github.com/oconnor663/kangarootwelve_xkcp.rs"
license-file = "LICENSE"
documentation = "https://docs.rs/kangarootwelve_xkcp"
readme = "README.md"
keywords = ["kangarootwelve", "k12"]

[dependencies]
arrayvec = "0.7.6"
constant_time_eq = "0.5.0"
rayon = { version = "1.12.0", optional = true }

[dev-dependencies]
digest = { version = "0.11.3", features = ["mac"] }
hex = "0.4.2"
k12 = "0.5.1"
page_size = "0.6.0"
rand = "0.10.1"

[build-dependencies]
bindgen = "0.72.1"
cc = "1.0.50"

[features]
default = ["rayon"]
rayon = ["dep:rayon"]
